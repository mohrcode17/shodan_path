<style>
  :root {
    --black: #0D0D0D;
    --ink: #1A1A1A;
    --paper: #F5F1E8;
    --paper-dim: #E8E2D4;
    --red: #C8102E;
    --red-deep: #9E0C24;
    --gold: #C9A227;
    --gold-soft: #D9BA5A;
    --gray: #8A8578;
  }

  .about-photo {
  width: 300px;
  border-radius: 10px;
  display: block;
  margin-top: 16px;
}

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
  }

  /* ---------- Top navigation ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--black);
    border-bottom: 3px solid var(--red);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 16px 0;
    cursor: pointer;
    background: none;
    border: none;
  }
  .brand .kanji {
    font-family: 'Zen Antique', serif;
    font-size: 28px;
    color: var(--red);
    line-height: 1;
  }
  .brand .name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    font-size: 18px;
    color: var(--paper);
    text-transform: uppercase;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  nav button.navlink {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--paper);
    background: none;
    border: none;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  nav button.navlink:hover { color: var(--gold-soft); }
  nav button.navlink.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  /* ---------- Page sections ---------- */
  .page { display: none; }
  .page.active { display: block; }

  main { min-height: calc(100vh - 200px); }

  /* ---------- HERO / HOME ---------- */
  .hero {
    background: var(--black);
    color: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 90px 24px 110px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 40px;
    align-items: center;
  }
  .hero-kanji {
    font-family: 'Zen Antique', serif;
    font-size: clamp(120px, 22vw, 300px);
    line-height: .8;
    color: transparent;
    -webkit-text-stroke: 2px var(--gold);
    text-stroke: 2px var(--gold);
    opacity: .9;
    justify-self: center;
    user-select: none;
  }
  .hero h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 6vw, 68px);
    line-height: 1.02;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .hero h1 .red { color: var(--red); display: block; }
  .hero p.lede {
    margin-top: 22px;
    font-size: 18px;
    max-width: 46ch;
    color: var(--paper-dim);
  }
  .hero .cta-row { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 14px;
    padding: 14px 26px;
    border: 2px solid var(--red);
    background: var(--red);
    color: #fff;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .btn:hover { background: transparent; color: var(--red); }
  .btn.ghost { background: transparent; border-color: var(--gold); color: var(--gold); }
  .btn.ghost:hover { background: var(--gold); color: var(--black); }

  /* ---------- Story strip ---------- */
  .strip {
    background: var(--red);
    color: #fff;
    text-align: center;
    padding: 14px 24px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 14px;
  }

    max-width: 900px;
    margin: 0 auto;
    padding: 72px 24px;
  }
  .section h2 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 32px;
    margin-bottom: 6px;
  }
  .section h2 .jp {
    font-family: 'Zen Antique', serif;
    color: var(--red);
    font-size: 24px;
    margin-left: 10px;
  }
  .rule { width: 60px; height: 4px; background: var(--gold); margin: 14px 0 28px; }
  .section p { font-size: 17px; margin-bottom: 18px; max-width: 68ch; }

  .cat-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;

  .cat-card {
    background: var(--black);
    color: var(--paper);
    padding: 28px 24px;
    cursor: pointer;
    border: none;
    text-align: left;
    border-left: 4px solid var(--red);
    transition: transform .15s, border-color .15s;

  .cat-card .en { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; font-size: 17px; margin-top: 8px; }
  .cat-card .cnt { color: var(--gray); font-size: 13px; margin-top: 6px; }

  /* ---------- Category page ---------- */
  .cat-header {
    background: var(--ink);
    color: var(--paper);
    padding: 54px 24px;
    text-align: center;
  }

  .cat-header .en { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 26px; margin-top: 8px; }
  .cat-header .desc { color: var(--paper-dim); margin-top: 10px; font-size: 15px; }

  .tech-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 24px 90px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .tech-card {
    background: #fff;
    border: 1px solid var(--paper-dim);
    border-top: 4px solid var(--red);
    padding: 22px;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }

  .tech-card .jp { font-family: 'Zen Antique', serif; font-size: 22px; color: var(--ink); }
  .tech-card .romaji { font-family: 'Oswald', sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 17px; margin-top: 6px; color: var(--red-deep); }
  .tech-card .en { color: var(--gray); font-size: 14px; margin-top: 2px; }
  .stars { margin-top: 12px; font-size: 15px; letter-spacing: 2px; }
  .stars .on { color: var(--gold); }
  .stars .off { color: var(--paper-dim); }

  .empty-note {
    max-width: 1200px; margin: 0 auto; padding: 0 24px 80px;
    color: var(--gray); font-style: italic;
  }

  /* ---------- Modal ---------- */
  .modal-back {
    display: none;
    position: fixed; inset: 0;
    background: rgba(13,13,13,.72);
    z-index: 200;
    padding: 24px;
    overflow-y: auto;
  }

  .modal {
    background: var(--paper);
    max-width: 640px;
    width: 100%;
    margin: 40px auto;
    border-top: 6px solid var(--red);
  }
  .modal-head { background: var(--black); color: var(--paper); padding: 28px 30px; position: relative; }
  .modal-head .jp { font-family: 'Zen Antique', serif; font-size: 34px; color: var(--gold); }

    display: inline-block; margin-top: 8px;
    font-family:'Oswald',sans-serif; text-transform: uppercase; letter-spacing:1px; font-size:13px;

  .video-link:hover { background: var(--gold-soft); }
  .unverified { color: var(--gray); font-style: italic; font-size: 14px; }

  footer {
    background: var(--black); color: var(--gray);
    text-align: center; padding: 30px 24px; font-size: 13px;
  }
  footer .kanji { font-family:'Zen Antique',serif; color: var(--red); font-size: 20px; }

  @media (max-width: 720px) {
    .hero-inner { grid-template-columns: 1fr; text-align: center; }
    .hero-kanji { grid-row: 1; font-size: 140px; }
    .hero .cta-row { justify-content: center; }

</style>
</head>

// Combine all into a single master array
const TECHNIQUES = [
  ...TE_WAZA,
  ...KOSHI_WAZA,
  ...ASHI_WAZA,
  ...MA_WAZA,
  ...YOKO_WAZA,
  ...OSAEKOMI_WAZA,
  ...SHIME_WAZA,
  ...KANSETSU_WAZA
];

/* ============================================================
   RENDERING
   ============================================================ */

  const main = document.getElementById('main');
  const navlist = document.getElementById('navlist');

  // Build nav
  function buildNav() {
    let html = `<li><button class="navlink" data-nav="home">Home</button></li>`;
    CATEGORIES.forEach(c => {
      html += `<li><button class="navlink" data-nav="cat:${c.id}">${c.romaji}</button></li>`;
    });
    html += `<li><button class="navlink" data-nav="about">About</button></li>`;
    navlist.innerHTML = html;
  }

  function starHTML(n) {
    let s = '';
    for (let i = 1; i <= 5; i++) {
      s += `<span class="${i <= n ? 'on' : 'off'}">★</span>`;
    }
    return `<span class="stars">${s}</span>`;
  }

  function homePage() {
    const cats = CATEGORIES.map(c => {
      const count = TECHNIQUES.filter(t => t.cat === c.id).length;
      return `<button class="cat-card" data-nav="cat:${c.id}">
        <div class="jp">${c.jp}</div>
        <div class="en">${c.romaji}</div>
        <div class="cnt">${c.en} · ${count} loaded</div>
      </button>`;
    }).join('');

    return `
    <section class="hero">
      <div class="hero-inner">
        <div>
          <h1>The Road to<span class="red">Black Belt</span></h1>
          <p class="lede">A clean, focused study guide to the judo throwing syllabus — organized the way the Kodokan classifies them, built for anyone working toward shodan.</p>
          <div class="cta-row">
            <button class="btn" data-nav="cat:te">Explore Techniques</button>
            <button class="btn ghost" data-nav="about">About</button>
          </div>
        </div>
        <div class="hero-kanji" aria-hidden="true">柔</div>
      </div>
    </section>
    <div class="strip">柔よく剛を制す — Softness controls hardness</div>
    <div class="cat-grid">${cats}</div>`;
  }

  function aboutPage() {
    return `
    <div class="cat-header">
      <div class="jp">道</div>
      <div class="en">The Path</div>
    </div>
    <section class="section">
      <h2>The Story <span class="jp">物語</span></h2>
      <div class="rule"></div>
      <p>Judo — the "gentle way" — was founded by Jigoro Kano in 1882. Its throwing techniques, the <em>nage-waza</em>, are traditionally organized into groups by how the throw is powered: by the hands, the hips, the legs, or by sacrificing one's own balance.</p>
      <p>This guide organizes the grading syllabus into those five categories so you can study one family of throws at a time on the road to your black belt, as well as some pins and submissions.</p>

      <h2 style="margin-top:48px;">About Me <span class="jp">私について</span></h2>
      <div class="rule"></div>
      <img src="judo.jpeg" alt="Brandon Mohr" class="about-photo">
      <p>Welcome to Shodan Path!

My name is Brandon "Tsuyoshi" Mohr. I am a Computer Science student at Temple University Japan and a passionate Judoka.

My Judo journey began at Kyushu University, where I joined the Judo club and competed in the prestigious Nanadaisen Tournament. Starting completely new to Judo, I relied on raw strength and a wrestling background. I quickly learned that brute force is not enough against refined technique.

That experience inspired me to build this site. By combining my Computer Science background with my love for Judo, I created this interactive dictionary to help practitioners study throws, understand grappling mechanics, and master technique.

My personal goal is to reach black belt, and I created this resource to support anyone sharing that same dream.</p>
    </section>`;
  }

  function categoryPage(catId) {
    const c = CATEGORIES.find(x => x.id === catId);
    const techs = TECHNIQUES.filter(t => t.cat === catId);
    const cards = techs.map((t, i) => `
      <button class="tech-card" data-tech="${catId}:${i}">
        <div class="jp">${t.jp}</div>
        <div class="romaji">${t.romaji}</div>
        <div class="en">${t.en}</div>
        ${starHTML(t.difficulty)}
      </button>`).join('');

    return `
    <div class="cat-header">
      <div class="jp">${c.jp}</div>
      <div class="en">${c.romaji}</div>
      <div class="desc">${c.desc}</div>
    </div>
    ${techs.length
      ? `<div class="tech-grid">${cards}</div>`
      : `<p class="empty-note">No techniques loaded in this category yet.</p>`}`;
  }
function getMastered() {
  const saved = localStorage.getItem("masteredTechniques");
  return saved ? JSON.parse(saved) : [];
}
function toggleMastered(id) {
  let list = getMastered();
  if (list.includes(id)) {
    list = list.filter(x => x !== id);
  } else {
    list.push(id);
  }
  localStorage.setItem("masteredTechniques", JSON.stringify(list));
}
  function openModal(catId, idx) {
    const t = TECHNIQUES.filter(x => x.cat === catId)[idx];
    const c = CATEGORIES.find(x => x.id === catId);
    const modal = document.getElementById('modal');
    const id = t.romaji;
    const isMastered = getMastered().includes(id);
    modal.innerHTML = `
      <div class="modal-head">
        <button class="modal-close" aria-label="Close">×</button>
        <div class="jp">${t.jp}</div>
        <div class="romaji">${t.romaji}</div>
        <div class="en">${t.en}</div>
      </div>
      <div class="modal-body">
        <div class="meta-row">
          <div><div class="meta-label">Category</div><div class="meta-val">${c.romaji}</div></div>
          <div><div class="meta-label">Difficulty</div><div class="meta-val">${starHTML(t.difficulty)}</div></div>
        </div>
        <button class="master-btn ${isMastered ? 'mastered' : ''}" data-master="${id}">
  <span class="master-kanji">極</span>
  <span class="master-label">${isMastered ? 'Mastered' : 'Mark as mastered'}</span>
</button>
        <h4>How it works</h4>
        <p>${t.description}</p>
        ${t.verified ? '' : '<p class="unverified">⚠ Draft description — verify against your official syllabus before relying on it.</p>'}
        <h4>Video</h4>
        ${t.video
          ? `<a class="video-link" href="${t.video}" target="_blank" rel="noopener">Watch demonstration →</a>`
          : `<p class="unverified">No verified video link added yet.</p>`}
      </div>`;
    document.getElementById('modalBack').classList.add('open');
    modal.querySelector('.modal-close').addEventListener('click', closeModal);
  }
  function closeModal() {
    document.getElementById('modalBack').classList.remove('open');
  }

  /* ---------- Router ---------- */
  function go(route) {
    let html = '';
    if (route === 'home') html = homePage();
    else if (route === 'about') html = aboutPage();
    else if (route.startsWith('cat:')) html = categoryPage(route.split(':')[1]);
    main.innerHTML = html;

    // active nav state
    document.querySelectorAll('.navlink').forEach(b => {
      b.classList.toggle('active', b.dataset.nav === route);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- Event delegation ---------- */
 document.addEventListener('click', (e) => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { go(nav.dataset.nav); return; }
    const tech = e.target.closest('[data-tech]');
    if (tech) {
      const [catId, idx] = tech.dataset.tech.split(':');
      openModal(catId, parseInt(idx, 10));
      return;
    }
    const master = e.target.closest('[data-master]');
    if (master) {
      toggleMastered(master.dataset.master);
      const nowMastered = getMastered().includes(master.dataset.master);
      master.classList.toggle('mastered', nowMastered);
      master.querySelector('.master-label').textContent = nowMastered ? 'Mastered' : 'Mark as mastered';
      return;
    }
  });
  document.getElementById('modalBack').addEventListener('click', (e) => {
    if (e.target.id === 'modalBack') closeModal();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // init
  buildNav();
  go('home');
</script>
</body>
</html>
